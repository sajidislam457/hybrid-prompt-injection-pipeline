# Keep Render Free web service awake by pinging /health every 10 minutes.
# Set repo secret: RENDER_HEALTH_URL = https://YOUR-SERVICE.onrender.com/health
#
# Note: Free tier can still briefly sleep if a ping fails. Paid "Starter" is true always-on.

name: Keep Render awake

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "Missing secret RENDER_HEALTH_URL (e.g. https://xxx.onrender.com/health)"
            exit 1
          fi
          # Retry a few times — cold start on Free can take ~30–60s
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 400 /tmp/health.json || true
              echo
              exit 0
            fi
            sleep 15
          done
          echo "Health check failed"
          exit 1
